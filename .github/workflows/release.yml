name: Release

# Push a tag like v2.0.0 (matching package.json "version") to build the Windows installer, smoke-test
# the installed app (fresh install, and an in-place upgrade over the previous release) and publish it as
# a GitHub Release: the installer, its .blockmap and latest.yml (the in-app updater's feed, see
# electron-builder.yml publish), SHA256SUMS.txt, and the version's CHANGELOG.md section as the release
# notes. Release checklist: docs/BUILD.md §6.
#
# Secret hygiene (docs/BUILD.md §7, docs/SECURITY.md):
#   - The build job has a READ-ONLY token, and checkout does not persist it in .git/config.
#   - Dependencies are installed (and typecheck/tests run) with NO secrets in the environment, so no
#     npm lifecycle script can read the signing certificate or its password. They are installed with
#     `npm ci --ignore-scripts`: no dependency install script runs on this machine at all (one could leave
#     code in node_modules that runs later, in the signing step); the few the build needs are reviewed in
#     scripts/install-scripts.mjs and run explicitly, and an unreviewed new one fails the release.
#   - The certificate reaches only the single packaging step, which runs the already-installed
#     electron-builder (`npx --no`: nothing is downloaded or installed at that point).
#   - Only the publish job can write to the repository; it checks out nothing and runs no npm code —
#     it downloads the built, smoke-tested artifact and creates the release.
#   - No caches are restored: a release is built from the committed lockfile (npm ci), never from a cache that
#     another workflow run could have written.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      # Fail fast (before a long build) when the changelog has no section for this version.
      - name: Check CHANGELOG.md has this version's release notes
        shell: bash
        run: node scripts/release-assets.mjs notes "${GITHUB_REF_NAME#v}" CHANGELOG.md

      # A release is built from the committed lockfile only (reproducible: the same tag always installs
      # the same versions). Without one, run the Lockfile workflow on the branch and re-tag.
      - name: Install dependencies (exact lockfile, no secrets in this environment)
        shell: bash
        run: |
          node scripts/lockfile-sync.mjs || { echo "::error::A release needs a package-lock.json that matches package.json. Run Actions > Lockfile on the branch, then tag the resulting commit."; exit 1; }
          node scripts/install-scripts.mjs --check || { echo "::error::A dependency has an install script that is not reviewed (scripts/install-scripts.mjs)."; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/install-scripts.mjs --run

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Ensure app icon
        run: node scripts/make-icon.mjs --if-missing

      - name: Build (main, core worker, preload, renderer)
        run: npm run build

      # Optional code signing: add WIN_CSC_LINK (base64 .pfx or https URL) and WIN_CSC_KEY_PASSWORD
      # repository secrets. They exist only in this step's environment; without them the installer is
      # built unsigned. after-pack.cjs fails the build if the Electron fuses cannot be applied.
      - name: Package (and sign, when a certificate is configured)
        shell: bash
        env:
          SIGNING_CERT: ${{ secrets.WIN_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "${SIGNING_CERT}" ]; then
            export WIN_CSC_LINK="${SIGNING_CERT}" WIN_CSC_KEY_PASSWORD="${SIGNING_PASSWORD}"
            echo "Code signing enabled."
          else
            echo "No signing certificate configured; building an unsigned installer."
          fi
          unset SIGNING_CERT SIGNING_PASSWORD
          npx --no -- electron-builder --win --x64 --publish never

      - name: Verify Electron fuses on the packaged binary
        run: npm run check:fuses

      # latest.yml must describe exactly this installer (version == tag, file name, sha512, size), the
      # .blockmap must exist and the packaged app must carry resources/app-update.yml for this repository.
      - name: Check the update files (latest.yml, blockmap, app-update.yml)
        shell: bash
        run: node scripts/release-assets.mjs check release "${GITHUB_REF_NAME#v}"

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-assets.mjs notes "${GITHUB_REF_NAME#v}" CHANGELOG.md release/release-notes.md

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum Pevqori-Setup-*.exe Pevqori-Setup-*.exe.blockmap latest.yml | tee SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: |
            release/Pevqori-Setup-*.exe
            release/Pevqori-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/release-notes.md
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Install, upgrade and launch the installer (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: release

      - name: Smoke-test the installed app
        shell: pwsh
        run: ./scripts/smoke-installed.ps1 -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Evidence smoke-evidence

      # The latest published release (this tag's own release does not exist yet), downloaded with this
      # job's read-only token. None yet, or no asset named Pevqori-Setup-*.exe: the upgrade smoke is skipped
      # with a notice.
      - name: Download the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'Pevqori-Setup-*.exe' --dir previous
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::notice::No previous release with a Pevqori-Setup-*.exe asset; the upgrade smoke test is skipped."
            Remove-Item -Recurse -Force previous
          }
          exit 0

      # In-place upgrade over the previous release: same folder and uninstall entry, version N, data and
      # settings untouched, N runs, N-1 refused afterwards (exit code 4), uninstall keeps data.
      - name: Upgrade smoke (previous release → this one)
        if: hashFiles('previous/Pevqori-Setup-*.exe') != ''
        shell: pwsh
        run: ./scripts/smoke-installed.ps1 -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Previous (Get-ChildItem previous/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Evidence smoke-evidence/upgrade

      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-evidence
          path: smoke-evidence/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: release

      - name: Verify checksums and the update feed version
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          grep -qx "version: ${GITHUB_REF_NAME#v}" latest.yml || { echo "::error::latest.yml is not for ${GITHUB_REF_NAME}"; exit 1; }

      # One step attaches everything the in-app updater and a manual download need; electron-builder
      # itself never publishes (--publish never).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Pevqori ${{ github.ref_name }}
          body_path: release/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/Pevqori-Setup-*.exe
            release/Pevqori-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
