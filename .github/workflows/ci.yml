name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A run already in progress on a branch always finishes (so every result is complete); newer pushes
# wait, and GitHub keeps only the newest waiting run. Pull requests cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  FORCE_COLOR: '1'

# Third-party actions are pinned to full commit SHAs (the comment gives the release); Dependabot
# (.github/dependabot.yml) proposes updates as reviewed pull requests.
#
# Dependencies: `npm ci` when package-lock.json is committed and matches package.json
# (scripts/lockfile-sync.mjs; exact, reproducible), otherwise `npm install` with a warning. The
# Lockfile workflow (.github/workflows/lockfile.yml) generates and commits the lockfile whenever
# package.json changes, then re-runs CI. Releases (release.yml) refuse to build without it.

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Types ship inside the electron package; the binary is not needed to typecheck or bundle.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package*.json

      - name: Install dependencies
        shell: bash
        run: |
          if node scripts/lockfile-sync.mjs; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing or does not match package.json; installing with npm install. The Lockfile workflow commits an updated lockfile and re-runs CI."
            npm install --no-audit --no-fund
          fi

      - name: Typecheck (core, main/preload, renderer, e2e specs)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (main, core worker, preload, renderer)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pevqori-out
          path: out/
          retention-days: 7
          if-no-files-found: error

  windows-installer:
    name: Windows unit tests + installer (NSIS x64)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Unsigned build: do not let electron-builder look for signing identities.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package*.json

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        shell: bash
        run: |
          if node scripts/lockfile-sync.mjs; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing or does not match package.json; installing with npm install. The Lockfile workflow commits an updated lockfile and re-runs CI."
            npm install --no-audit --no-fund
          fi

      # Windows is the only shipped platform: paths, file locking during temp cleanup, CRLF and
      # case-insensitive paths are exercised here on every push, not first at release time.
      - name: Unit tests (Windows)
        run: npm test

      - name: Ensure app icon
        run: node scripts/make-icon.mjs --if-missing

      # scripts/after-pack.cjs fails the build if the Electron fuses cannot be applied. dist:win runs
      # electron-builder with --publish never: CI builds are never published.
      - name: Build installer
        run: npm run dist:win

      - name: Verify Electron fuses on the packaged binary
        run: npm run check:fuses

      # The in-app updater's files: latest.yml (this version, the installer's sha512 and size), the
      # .blockmap, and resources/app-update.yml in the packaged app (electron-builder.yml publish).
      - name: Check the update files (latest.yml, blockmap, app-update.yml)
        shell: bash
        run: node scripts/release-assets.mjs check release "$(node -p "require('./package.json').version")"

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pevqori-Windows-Installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  windows-smoke:
    name: Install and launch the packaged app (Windows)
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # download the 1.x installer artifact of an earlier run (upgrade step below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pevqori-Windows-Installer
          path: release

      # Silent per-user install, then the installed Pevqori.exe (fuses on, app.asar, core worker in
      # app.asar.unpacked, node:sqlite) is started with PEVQORI_SMOKE_TEST=1: it calls app.state through
      # the real bridge, logs the verdict and quits with exit code 0/1. Then it is uninstalled.
      - name: Smoke-test the installed app
        shell: pwsh
        run: ./scripts/smoke-installed.ps1 -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Evidence smoke-evidence

      # build/installer.nsh: a silent install while Pevqori runs waits 30 s, then exits with code 3 and
      # changes nothing — Pevqori is never closed by the installer; after it is closed the install works.
      - name: Installer leaves a running Pevqori alone (exit code 3)
        shell: pwsh
        run: ./scripts/smoke-installed.ps1 -Scenario RunningApp -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Evidence smoke-evidence/running-app

      # build/installer.nsh: installing over a newer version is refused silently with exit code 4 unless
      # /ALLOWDOWNGRADE is given. (The upgrade over a real previous release runs in release.yml.)
      - name: Installer refuses a downgrade (exit code 4)
        shell: pwsh
        run: ./scripts/smoke-installed.ps1 -Scenario Downgrade -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Evidence smoke-evidence/downgrade

      # The in-place upgrade over the 1.x build people have installed (the installer CI built from
      # 0ddf9b6, before any GitHub Release existed — release.yml upgrades over the previous Release
      # instead): same uninstall entry and folder, the new version, data and settings byte-for-byte
      # kept, and the upgraded app starts. Skipped with a notice once that artifact has expired.
      - name: Download the 1.x installer (CI run 38056735590, commit 0ddf9b6)
        id: previous
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pevqori-Windows-Installer
          path: previous
          run-id: 38056735590
          github-token: ${{ github.token }}

      - name: Upgrade the 1.x installation in place (data and settings kept)
        shell: pwsh
        run: |
          $previous = Get-ChildItem previous/Pevqori-Setup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $previous) {
            Write-Host '::notice::The 1.x installer artifact is no longer available; the 1.x upgrade smoke test is skipped.'
            exit 0
          }
          ./scripts/smoke-installed.ps1 -Installer (Get-ChildItem release/Pevqori-Setup-*.exe | Select-Object -First 1).FullName -Previous $previous.FullName -Evidence smoke-evidence/upgrade-1x

      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-evidence
          path: smoke-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # The app runs the core inside Electron's bundled Node, which is newer than the Node used for the
  # unit tests above and validates some node:sqlite / node:* arguments more strictly (a backup that
  # passed every unit test failed in the app). Run the same suite inside Electron's runtime too.
  electron-node:
    name: Unit tests on Electron's Node runtime
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package*.json

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          if node scripts/lockfile-sync.mjs; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing or does not match package.json; installing with npm install. The Lockfile workflow commits an updated lockfile and re-runs CI."
            npm install --no-audit --no-fund
          fi

      - name: Unit tests inside Electron (ELECTRON_RUN_AS_NODE)
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          npx --no -- electron -p "'Electron ' + process.versions.electron + ', Node ' + process.versions.node + ', SQLite ' + process.versions.sqlite"
          npx --no -- electron --test --test-reporter=spec "src/**/*.test.ts"

  e2e:
    name: End-to-end (Electron + Playwright, ${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package*.json

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          if node scripts/lockfile-sync.mjs; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing or does not match package.json; installing with npm install. The Lockfile workflow commits an updated lockfile and re-runs CI."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor, which Chromium's sandbox
      # needs. Re-enable them for this runner instead of weakening the app with --no-sandbox.
      - name: Allow Chromium sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Playwright (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npx playwright test

      - name: Playwright
        if: runner.os == 'Windows'
        run: npx playwright test

      # Failing tests leave a window screenshot (attached in the report) and trace.zip (open with
      # `npx playwright show-trace`) in test-results/ — see e2e/support.ts.
      - name: Upload Playwright report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
