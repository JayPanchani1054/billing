name: UI snapshots

# Design review: screenshots of the key screens of a seeded demo company (e2e/snapshots.spec.ts), at
# 1366×768, light and dark. Manual only — nothing here gates a merge. The images are uploaded as an
# artifact and, for reviewers who can read logs but not artifacts, printed to the log as base64.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_COLOR: '1'

jobs:
  snapshots:
    name: Snapshots (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package*.json

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          if node scripts/lockfile-sync.mjs; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Capture
        env:
          PEVQORI_SNAPSHOTS: '1'
          PEVQORI_SNAPSHOT_LOG: '1'
          PEVQORI_SNAPSHOT_PART: ${{ matrix.part }}/3
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npx playwright test e2e/snapshots.spec.ts

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots-${{ matrix.part }}
          path: test-results/snapshots/
          retention-days: 14
          if-no-files-found: warn
