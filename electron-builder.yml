# electron-builder configuration — Windows x64 NSIS installer.
# Build:  npm run dist:win      (runs scripts/build.mjs first; output in release/)
# Docs:   docs/BUILD.md (packaging, release checklist), docs/INSTALL.md (upgrading in place)
#
# appId and productName must never change: the installer derives its uninstall key (a GUID) from appId
# and its folders from productName, and that is how a newer installer finds and upgrades the existing
# installation in place (same folder, same Start-menu entry, data and settings kept).
appId: com.pevqori.app
productName: Pevqori
copyright: Copyright © 2026 Pevqori

directories:
  output: release
  buildResources: build

# Everything the app needs is bundled into out/ by scripts/build.mjs (main, preload, renderer), so no
# node_modules are shipped. All npm packages are devDependencies, which electron-builder never packs.
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
# No native modules (SQLite is node:sqlite, built into Electron) → nothing to rebuild.
npmRebuild: false
asar: true
# The accounting core runs on a worker thread (out/main/core-worker.cjs, see docs/BUILD.md §3). A
# worker thread loads its script with plain file I/O, which cannot read inside app.asar, so this one
# file is shipped next to the archive in resources/app.asar.unpacked/ (src/main/core-proxy.ts →
# workerScriptPath). It requires only node:* builtins.
asarUnpack:
  - out/main/core-worker.cjs
# Keep only the Chromium UI locales the app needs (smaller install).
electronLanguages:
  - en-US
  - en-GB
# Hardens the packaged binary with Electron fuses (no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS,
# no --inspect, app code only from app.asar). See scripts/after-pack.cjs; it fails the build when the
# fuses cannot be applied, and scripts/check-fuses.cjs reads them back in CI.
afterPack: scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Pevqori-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
  # verifyUpdateCodeSignature is left at its default (on): once installers are code-signed
  # (WIN_CSC_LINK, docs/BUILD.md §7) the in-app updater also requires the downloaded installer to carry
  # the running app's Authenticode publisher. Unsigned builds rely on the sha512 in latest.yml.

nsis:
  oneClick: false
  # Per-user by default ("Only for me", no administrator rights); "Anyone who uses this computer" stays
  # available and elevates. An existing per-machine installation is upgraded per-machine (the install
  # mode page pre-selects the mode found in the registry).
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pevqori
  uninstallDisplayName: Pevqori ${version}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Branded pages (generated by scripts/make-icon.mjs, never edited by hand): 164×314 sidebar on the
  # welcome / finish pages, 150×57 header on the inner pages.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  runAfterFinish: true
  # Company data lives in the user-chosen data folder and settings in %APPDATA%\Pevqori —
  # both must survive uninstall/reinstall.
  deleteAppDataOnUninstall: false
  # Running-app check (never force-closes Pevqori) and the downgrade guard: build/installer.nsh.
  include: build/installer.nsh

# Update feed for the in-app updater (src/main/updates). With a publish provider configured, every build
# also writes release/latest.yml (version, file name, sha512) and Pevqori-Setup-<version>.exe.blockmap,
# and embeds resources/app-update.yml (this provider, owner and repo) in the packaged app. Nothing is
# ever uploaded by electron-builder: every build runs with --publish never, and
# .github/workflows/release.yml attaches the installer, blockmap, latest.yml and SHA256SUMS.txt to the
# GitHub Release itself.
publish:
  - provider: github
    owner: JayPanchani1054
    repo: billing
    releaseType: release
